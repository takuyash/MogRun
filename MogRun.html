<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モグラン</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:8px;
    padding-top:max(8px, env(safe-area-inset-top));
    padding-bottom:max(8px, env(safe-area-inset-bottom));
    padding-left:max(8px, env(safe-area-inset-left));
    padding-right:max(8px, env(safe-area-inset-right));
    background: linear-gradient(#bfe9ff, #eaf9ff);
    font-family: "Hiragino Maru Gothic ProN","Comic Sans MS",sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none; user-select:none;
  }
  h1 { color:#ff8fab; margin-bottom:10px; text-shadow:1px 1px 0 #fff; }
  #wrap {
    position:relative;
    width:100%;
    max-width:800px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    border:4px solid #fff;
    touch-action:none; /* ゲーム領域ではスクロール・ズームを無効化 */
  }
  canvas { display:block; width:100%; height:auto; background:#cdefff; }
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.85);
    text-align:center;
    font-size:20px;
    color:#555;
    padding:8px;
  }
  #overlay.hidden { display:none; }
  #overlay .sub { display:inline-block; margin-top:8px; font-size:0.8em; color:#888; }
  button {
    padding:10px 24px;
    font-size:16px;
    border:none;
    border-radius:20px;
    background:#ff8fab;
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 #e06e8c;
  }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 #e06e8c; }
  button small { display:block; margin-top:2px; font-size:11px; opacity:0.9; }
  button.cave { background:#7a5cff; box-shadow:0 4px 0 #5a3fd6; }
  button.cave:active { box-shadow:0 2px 0 #5a3fd6; }
  button.lv-easy { background:#4cc38a; box-shadow:0 4px 0 #2f9a68; }
  button.lv-easy:active { box-shadow:0 2px 0 #2f9a68; }
  button.lv-hard { background:#ff7a45; box-shadow:0 4px 0 #d95a27; }
  button.lv-hard:active { box-shadow:0 2px 0 #d95a27; }
  button.ghost { background:#a3a3a3; box-shadow:0 4px 0 #838383; padding:6px 16px; font-size:13px; }
  button.ghost:active { box-shadow:0 2px 0 #838383; }
  button.sky { background:#3fa4ff; box-shadow:0 4px 0 #2381d6; }
  button.sky:active { box-shadow:0 2px 0 #2381d6; }
  button.sea { background:#13b3a6; box-shadow:0 4px 0 #0d8a80; }
  button.sea:active { box-shadow:0 2px 0 #0d8a80; }
  .btnrow { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  #hint { margin-top:10px; color:#777; font-size:14px; text-align:center; }
  #rotate { display:none; margin-top:8px; color:#ff8fab; font-size:14px; font-weight:bold; text-align:center; }
  #score { position:absolute; top:10px; right:16px; font-size:18px; color:#555; font-weight:bold; text-shadow:1px 1px 0 #fff; }
  #stage { position:absolute; top:10px; left:16px; font-size:14px; color:#555; font-weight:bold; text-shadow:1px 1px 0 #fff; }
  #wrap.cave #score, #wrap.cave #stage { color:#f3e9ff; text-shadow:1px 1px 0 #000; }
  #wrap.sky #score, #wrap.sky #stage { color:#fff; text-shadow:1px 1px 0 rgba(0,80,150,0.75); }
  #wrap.sea #score, #wrap.sea #stage { color:#eafcff; text-shadow:1px 1px 0 rgba(0,40,90,0.85); }

  #dashBtn {
    position:absolute;
    right:14px;
    bottom:14px;
    width:58px;
    height:58px;
    border-radius:50%;
    padding:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:26px;
    background:radial-gradient(circle at 35% 30%, #ffb84d, #ff8f2e);
    box-shadow:0 4px 0 #cc6e10, 0 0 0 3px rgba(255,255,255,0.6);
    z-index:5;
    touch-action:none;
  }
  #wrap.playing #dashBtn { display:flex; }
  #dashBtn:active { transform:translateY(2px); box-shadow:0 2px 0 #cc6e10, 0 0 0 3px rgba(255,255,255,0.6); }
  #dashBtn:disabled { opacity:0.4; filter:grayscale(0.5); box-shadow:0 4px 0 #999, 0 0 0 3px rgba(255,255,255,0.4); }

  @media (max-width:600px){
    h1 { font-size:20px; margin-bottom:8px; }
    #overlay { font-size:15px; }
    #score { font-size:14px; top:6px; right:10px; }
    #stage { font-size:12px; top:7px; left:10px; }
    button { padding:12px 22px; }
    button[data-level] { padding:10px 8px; font-size:13px; }
    button[data-stage] { padding:10px 12px; font-size:14px; }
    button.ghost { padding:6px 14px; }
    button small { display:none; }
    .btnrow { margin-top:8px; gap:8px; }
    #overlay .sub { margin-top:4px; }
  }
  /* スマホ縦持ちのときは横向きを案内 */
  @media (orientation:portrait) and (max-width:600px){
    #rotate { display:block; }
  }
</style>
</head>
<body>
<h1>🐾 モグラン 🐾</h1>
<div id="wrap">
  <canvas id="game" width="800" height="300"></canvas>
  <div id="stage">STAGE 1 草原</div>
  <div id="score">SCORE: 0</div>
  <button id="dashBtn" title="ジェットダッシュ">🚀</button>
  <div id="overlay"></div>
</div>
<div id="rotate">📱 スマホを横向きにすると遊びやすいよ！</div>
<div id="hint">スペースキー・クリック・タップでジャンプ／Shiftキーか🚀ボタンでジェットダッシュ</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const groundY = 220; // 高さ0(平坦)のときの地面ライン
const maxHill = 70;  // 坂の最大高さ

const wrap = document.getElementById('wrap');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const stageEl = document.getElementById('stage');

// ---------- ステージ設定 ----------
// 自動ステージ進行：草原 → 洞窟 → 空 → 海底。各ステージに入ってから dist 点進むと入り口が現れる
// 自動で進ませたくない場合は AUTO_ADVANCE を false にする
const AUTO_ADVANCE = true;
const ADVANCE = {
  meadow: { to:'cave', dist:400 },
  cave:   { to:'sky',  dist:500 },
  sky:    { to:'sea',  dist:500 }
};
const BANNER_FRAMES = 110;
const STAGE_INFO = {
  meadow: { label:'STAGE 1 草原', banner:'STAGE 1  草原', icon:'🌿', name:'草原' },
  cave:   { label:'STAGE 2 洞窟', banner:'STAGE 2  洞窟', icon:'🕳️', name:'洞窟' }
};

STAGE_INFO.sky = { label:'STAGE 3 空', banner:'STAGE 3  空', icon:'☁️', name:'空' };
STAGE_INFO.sea = { label:'STAGE 4 海底', banner:'STAGE 4  海底', icon:'🌊', name:'海底' };
// 穴の出やすさ（ステージ別の倍率）。海底の穴は「海溝」
STAGE_INFO.meadow.gapMul = 1;
STAGE_INFO.cave.gapMul = 2;
STAGE_INFO.sky.gapMul = 1.5;
STAGE_INFO.sea.gapMul = 1.5;

// ---------- レベル（難易度）設定 ----------
// baseSpeed/accel   : 走る速さの初期値と、スコアに応じた加速の強さ
// spacing*          : 障害物どうしの間隔（大きいほどゆったり）
// gapWeight/gapLen  : 穴（水たまり・溶岩）の出やすさと長さ [最小, ばらつき]
// gemChance         : 洞窟で宝石が出る確率
// dark              : 洞窟の暗さ（inner=明るい範囲の半径, alpha=まわりの暗さ）
const LEVELS = {
  easy: {
    name:'かんたん', emoji:'🐣',
    baseSpeed:5, accel:0.007,
    spacingBase:460, spacingSlope:0.6, spacingMin:260, spacingRand:180,
    gapWeight:0.5, gapLen:[45, 30],
    gemChance:0.9, dark:{ inner:120, alpha:0.5 },
    desc:{ meadow:'ゆっくり・穴すくなめ', cave:'ゆっくり・明るめ' }
  },
  normal: {
    name:'ふつう', emoji:'🐾',
    baseSpeed:6, accel:0.01,
    spacingBase:380, spacingSlope:0.8, spacingMin:180, spacingRand:160,
    gapWeight:1, gapLen:[55, 45],
    gemChance:0.75, dark:{ inner:90, alpha:0.68 },
    desc:{ meadow:'ふつうの速さ', cave:'ふつうの速さ' }
  },
  hard: {
    name:'むずかしい', emoji:'🔥',
    baseSpeed:7, accel:0.013,
    spacingBase:330, spacingSlope:1.0, spacingMin:170, spacingRand:120,
    gapWeight:1.6, gapLen:[60, 55],
    gemChance:0.6, dark:{ inner:70, alpha:0.8 },
    desc:{ meadow:'はやい・穴おおめ', cave:'はやい・まっくら' }
  }
};
const CAVE_CRYSTALS = ['#7de3ff', '#ff8ad8', '#b69cff'];
// 洞窟の障害物は先端がとがっているので、当たり判定を少し内側にする（0.22 = 左右22%ずつ）
const HIT_INSET = { stalagmite: 0.22, crystal: 0.1, stormcloud: 0.1, tornado: 0.15, urchin: 0.15, coral: 0.12 };
const SEA_CORALS = ['#ff7a90', '#ffa64d', '#c77dff'];

LEVELS.easy.desc.sky = 'ゆっくり・穴すくなめ';
LEVELS.normal.desc.sky = 'ふつうの速さ';
LEVELS.hard.desc.sky = 'はやい・穴おおめ';

LEVELS.easy.desc.sea = 'ゆっくり・海溝すくなめ';
LEVELS.normal.desc.sea = 'ふつうの速さ';
LEVELS.hard.desc.sea = 'はやい・海溝おおめ';

let stageKey = 'meadow';   // いま遊んでいるステージ
let startStage = 'meadow'; // 「もういちど」で戻るステージ
let levelKey = 'normal';   // いま遊んでいるレベル
let startLevel = 'normal'; // 「もういちど」で戻るレベル
let pendingStage = 'meadow'; // レベル選択中のステージ
let menuStep = 'stage';      // 'stage' | 'level'

function levelMenuHTML(stage){
  const st = STAGE_INFO[stage];
  const btns = Object.keys(LEVELS).map(k => {
    const lv = LEVELS[k];
    return `<button data-level="${k}" class="lv-${k}">${lv.emoji} ${lv.name}<small>${lv.desc[stage]}</small></button>`;
  }).join('');
  return `<div>${st.icon} ${st.name}ステージ<br><span class="sub">むずかしさをえらんでね</span></div>` +
    `<div class="btnrow">${btns}</div>` +
    '<div class="btnrow"><button id="backBtn" class="ghost">← もどる</button></div>';
}

const MENU_HTML =
  '<div>タップ / クリック / スペースキーでジャンプ！<br>坂道・岩・水たまりを避けよう🐾' +
  '<br><span class="sub">ステージをえらんでね</span></div>' +
  '<div class="btnrow">' +
    '<button data-stage="meadow">🌿 草原<small>坂道と水たまり</small></button>' +
    '<button data-stage="cave" class="cave">🕳️ 洞窟<small>暗闇で宝石あつめ</small></button>' +
    '<button data-stage="sky" class="sky">☁️ 空<small>雲の上をかけぬけろ</small></button>' +
    '<button data-stage="sea" class="sea">🌊 海底<small>海の底で真珠あつめ</small></button>' +
  '</div>';

let state = 'ready'; // ready, playing, over
let speed = 6;
let baseSpeed = 6;
let score = 0;
let bonus = 0;       // 宝石ボーナス（加速には影響しない）
let frame = 0;
let scrollX = 0; // これまでに進んだ距離（ワールド座標）

// 固定タイムステップ用（60Hz相当に統一）
const STEP = 1000 / 60;
let last = 0, acc = 0;

// 猫
const cat = {
  x: 90,
  y: groundY,
  w: 44,
  h: 34,
  vy: 0,
  onGround: true,
  jumpPower: -13,
  gravity: 0.65,
  legPhase: 0,
  runFrame: 0,
  runTimer: 0,
  falling: false,
  dashOffset: 0,
  dashCharge: 0
};
const lamp = { x:0, y:0 }; // ヘルメットのライトの画面座標

// 地形（坂・平坦・落とし穴）のセグメント一覧
let terrainSegments = [];
let genFrontier = 0;
let curH = 0;

// 障害物・宝石・演出
let obstacles = []; // {worldX, w, h, type, baseH}
let gems = [];      // {worldX, y, phase, taken}
let pops = [];      // {x, y, t}
let nextSpawnDist = 0;
let gate = null;    // 洞窟の入り口 {x, w}
let fade = 0;       // 黒フェード
let banner = { text:'', t:0 };
let stageStartScore = 0; // 今のステージに入った時点のスコア
let fadeColor = '0,0,0'; // 切り替え時のフェードの色（洞窟=黒、空=白、海底=青）

// ---------- ジェットダッシュ ----------
const DASH_COOLDOWN = 85; // フレーム数（約1.4秒）
const DASH_KICK = 58;     // 一気に前へ進む距離(px)

function tryDash(){
  if(state !== 'playing') return;
  if(cat.dashCharge > 0) return;
  cat.dashOffset += DASH_KICK;
  cat.dashCharge = DASH_COOLDOWN;
}

function hash(n){
  const s = Math.sin(n*127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function initTerrain(){
  terrainSegments = [{x0:0, x1:500, h0:0, h1:0, gap:false}];
  genFrontier = 500;
  curH = 0;
  generateTerrain();
}

function generateTerrain(){
  while(genFrontier < scrollX + W + 500){
    const canUp = curH < maxHill - 15;
    const canDown = curH > 3;
    const canGap = curH < 3;

    const lv = LEVELS[levelKey];
    // 洞窟は溶岩の穴が多め。さらにレベルで穴の出やすさが変わる
    const gapW = STAGE_INFO[stageKey].gapMul * lv.gapWeight;
    const table = [['flat', 3]];
    if(canUp) table.push(['up', 2]);
    if(canDown) table.push(['down', 2]);
    if(canGap) table.push(['gap', gapW]);

    let roll = Math.random() * table.reduce((s, e) => s + e[1], 0);
    let type = table[table.length-1][0];
    for(const [t, w] of table){
      if(roll < w){ type = t; break; }
      roll -= w;
    }
    let len, h0 = curH, h1 = curH, gapFlag = false;

    if(type === 'flat'){
      len = 100 + Math.random()*150;
      h1 = curH;
    } else if(type === 'up'){
      len = 90 + Math.random()*100;
      h1 = Math.min(maxHill, curH + 22 + Math.random()*35);
    } else if(type === 'down'){
      len = 90 + Math.random()*100;
      h1 = Math.max(0, curH - (22 + Math.random()*35));
    } else { // gap
      len = lv.gapLen[0] + Math.random()*lv.gapLen[1];
      h0 = 0; h1 = 0; gapFlag = true;
    }

    terrainSegments.push({x0:genFrontier, x1:genFrontier+len, h0, h1, gap:gapFlag});
    curH = h1;
    genFrontier += len;
  }
  // 画面より十分後ろのセグメントは破棄
  terrainSegments = terrainSegments.filter(s => s.x1 > scrollX - 150);
}

function getHeightAt(wx){
  for(const seg of terrainSegments){
    if(wx >= seg.x0 && wx < seg.x1){
      if(seg.gap) return 0;
      const t = (wx - seg.x0) / (seg.x1 - seg.x0);
      return seg.h0 + (seg.h1 - seg.h0) * t;
    }
  }
  return 0;
}

function isGapAt(wx){
  for(const seg of terrainSegments){
    if(wx >= seg.x0 && wx < seg.x1) return !!seg.gap;
  }
  return false;
}

function applyStageUI(){
  stageEl.textContent = STAGE_INFO[stageKey].label + ' ・ ' + LEVELS[levelKey].name;
  wrap.classList.toggle('cave', stageKey === 'cave');
  wrap.classList.toggle('sky', stageKey === 'sky');
  wrap.classList.toggle('sea', stageKey === 'sea');
}

function showBanner(){
  banner.text = STAGE_INFO[stageKey].banner;
  banner.sub = LEVELS[levelKey].emoji + ' ' + LEVELS[levelKey].name;
  banner.t = BANNER_FRAMES;
}

function resetGame(){
  stageKey = startStage;
  levelKey = startLevel;
  baseSpeed = LEVELS[levelKey].baseSpeed;
  speed = baseSpeed;
  score = 0;
  bonus = 0;
  frame = 0;
  scrollX = 0;
  obstacles = [];
  gems = [];
  pops = [];
  gate = null;
  fade = 0;
  fadeColor = '0,0,0';
  stageStartScore = 0;
  cat.y = groundY;
  cat.vy = 0;
  cat.onGround = true;
  cat.falling = false;
  cat.dashOffset = 0;
  cat.dashCharge = 0;
  nextSpawnDist = 260;
  initTerrain();
  applyStageUI();
  showBanner();
}

function jump(){
  if(state === 'ready'){
    if(menuStep === 'stage') startGame(); // ステージ画面ならタップで前回の設定ですぐ開始
    return;
  }
  if(state === 'over'){ return; }
  if(cat.onGround){
    cat.vy = cat.jumpPower;
    cat.onGround = false;
  }
}

function startGame(stage, level){
  if(typeof stage === 'string') startStage = stage;
  if(typeof level === 'string') startLevel = level;
  resetGame();
  state = 'playing';
  overlay.classList.add('hidden');
  wrap.classList.add('playing');
  last = 0; acc = 0;
  requestAnimationFrame(loop);
}

function showMenu(){
  state = 'ready';
  menuStep = 'stage';
  overlay.innerHTML = MENU_HTML;
  overlay.classList.remove('hidden');
  wrap.classList.remove('playing');
}

function showLevelMenu(stage){
  pendingStage = stage;
  menuStep = 'level';
  overlay.innerHTML = levelMenuHTML(stage);
}

function gameOver(){
  state = 'over';
  overlay.classList.remove('hidden');
  wrap.classList.remove('playing');
  const total = Math.floor(score + bonus);
  overlay.innerHTML =
    `<div>💥 ざんねん！<br>${STAGE_INFO[stageKey].label} ・ ${LEVELS[levelKey].name}<br>スコア: ${total}</div>` +
    '<div class="btnrow"><button id="retryBtn">もういちど</button>' +
    '<button id="menuBtn" class="cave">ステージ選択</button></div>';
}

// ---------- 洞窟の入り口（草原 → 洞窟） ----------
function tryPlaceGate(){
  const gx = scrollX + W + 220;
  for(let x = gx - 50; x <= gx + 140; x += 10){
    if(isGapAt(x)) return; // 穴の近くには置かない
  }
  if(Math.abs(getHeightAt(gx) - getHeightAt(gx + 90)) > 10) return; // ほぼ平らな場所だけ
  gate = { x: gx, w: 90, to: ADVANCE[stageKey].to };
}

function enterStage(to){
  stageKey = to;
  stageStartScore = score;
  gate = null;
  fade = 1;
  fadeColor = (to === 'sky') ? '255,255,255' : (to === 'sea') ? '30,120,200' : '0,0,0';
  nextSpawnDist = 320;
  applyStageUI();
  showBanner();
}

function gatePending(){
  const adv = ADVANCE[stageKey];
  return AUTO_ADVANCE && !!adv && (score - stageStartScore) >= adv.dist;
}

// ---------- 障害物・宝石 ----------
function spawnObstacle(){
  const worldX = scrollX + W + 30;
  // 穴の上には障害物を置かない
  if(isGapAt(worldX) || isGapAt(worldX+40)) return;

  const baseH = getHeightAt(worldX);

  if(stageKey === 'sky'){
    let o;
    if(Math.random() < 0.55){
      const h = 26 + Math.random()*12;
      o = {worldX, w: 34+Math.random()*12, h, type:'stormcloud', baseH};
    } else {
      const h = 42 + Math.random()*14;
      o = {worldX, w: 22+Math.random()*8, h, type:'tornado', baseH};
    }
    obstacles.push(o);
    if(Math.random() < LEVELS[levelKey].gemChance) spawnGems(worldX + o.w + 40);
    return;
  }

  if(stageKey === 'sea'){
    let o;
    if(Math.random() < 0.5){
      const h = 26 + Math.random()*12;
      o = {worldX, w: 32+Math.random()*10, h, type:'urchin', baseH};
    } else {
      const h = 30 + Math.random()*20;
      o = {worldX, w: 28+Math.random()*10, h, type:'coral', baseH,
           hue: Math.floor(Math.random()*SEA_CORALS.length)};
    }
    obstacles.push(o);
    if(Math.random() < LEVELS[levelKey].gemChance) spawnGems(worldX + o.w + 40);
    return;
  }

  if(stageKey === 'cave'){
    let o;
    if(Math.random() < 0.55){
      const h = 30 + Math.random()*24;
      o = {worldX, w: 22+Math.random()*10, h, type:'stalagmite', baseH};
    } else {
      const h = 26 + Math.random()*16;
      o = {worldX, w: 30+Math.random()*12, h, type:'crystal', baseH,
           hue: Math.floor(Math.random()*CAVE_CRYSTALS.length)};
    }
    obstacles.push(o);
    if(Math.random() < LEVELS[levelKey].gemChance) spawnGems(worldX + o.w + 40);
    return;
  }

  const isRock = Math.random() < 0.5;
  if(isRock){
    const h = 22 + Math.random()*18;
    obstacles.push({worldX, w: 30+Math.random()*14, h, type:'rock', baseH});
  } else {
    const h = 28 + Math.random()*22;
    obstacles.push({worldX, w: 24+Math.random()*10, h, type:'block', baseH});
  }
}

function spawnGems(fromX){
  const n = Math.random() < 0.5 ? 3 : 5;
  for(let k=0; k<n; k++){
    const wx = fromX + k*22;
    const arc = Math.sin(k/(n-1)*Math.PI) * 22;
    const y = groundY - getHeightAt(wx) - 42 - arc;
    gems.push({worldX: wx, y, phase: Math.random()*60, taken:false});
  }
}

function update(){
  frame++;
  score += speed*0.05;
  speed = baseSpeed + score*LEVELS[levelKey].accel; // 徐々に加速

  // ジェットダッシュの減衰・クールダウン
  if(cat.dashCharge > 0) cat.dashCharge--;
  cat.dashOffset *= 0.86;
  if(Math.abs(cat.dashOffset) < 0.5) cat.dashOffset = 0;

  scrollX += speed;
  generateTerrain();

  // 草原 → 洞窟 → 空 → 海底 の切り替え
  if(AUTO_ADVANCE && ADVANCE[stageKey]){
    if(!gate && gatePending()) tryPlaceGate();
    if(gate && scrollX + cat.x + cat.dashOffset >= gate.x + gate.w*0.5) enterStage(gate.to);
  }
  if(fade > 0) fade = Math.max(0, fade - 0.025);
  if(banner.t > 0) banner.t--;

  const worldXAtCat = scrollX + cat.x + cat.dashOffset;
  const gapHere = isGapAt(worldXAtCat);
  const surfaceH = getHeightAt(worldXAtCat);
  const surfaceY = groundY - surfaceH;

  if(cat.onGround){
    if(gapHere){
      cat.onGround = false;
      cat.vy = 0;
      cat.falling = true; // ジャンプせず水(溶岩)に落ちた＝助からない
    } else {
      cat.y = surfaceY;
      cat.vy = 0;
    }
  } else {
    cat.vy += cat.gravity;
    cat.y += cat.vy;

    if(cat.falling){
      // 水/穴に落下確定。そのまま沈んでゲームオーバー
      if(cat.y > (stageKey === 'sky' ? H + 60 : groundY + 45)){
        gameOver();
        return;
      }
    } else if(gapHere){
      // ジャンプ中に穴の上へ。飛び越えられず沈み始めたら確定
      if(cat.vy >= 0 && cat.y >= surfaceY){
        cat.falling = true;
      }
    } else if(cat.vy >= 0 && cat.y >= surfaceY){
      cat.y = surfaceY;
      cat.vy = 0;
      cat.onGround = true;
    }
  }

  if(!cat.onGround){
    cat.legPhase = 0;
  } else {
    cat.legPhase += 0.5;
    cat.runTimer += speed;
    if(cat.runTimer > 60){
      cat.runTimer = 0;
      cat.runFrame = cat.runFrame === 0 ? 1 : 0;
    }
  }

  // 障害物の後始末とスポーン
  obstacles = obstacles.filter(o => (o.worldX - scrollX + o.w) > -30);
  gems = gems.filter(g => !g.taken && (g.worldX - scrollX) > -30);
  pops = pops.filter(p => p.t < 40);
  for(const p of pops) p.t++;

  nextSpawnDist -= speed;
  if(nextSpawnDist <= 0 && !gatePending()){
    spawnObstacle();
    const lv = LEVELS[levelKey];
    nextSpawnDist = Math.max(lv.spacingMin, lv.spacingBase - score*lv.spacingSlope) + Math.random()*lv.spacingRand;
  }

  // 当たり判定
  const catBox = {x: cat.x+cat.dashOffset+6, y: cat.y-cat.h+6, w: cat.w-14, h: cat.h-10};
  for(const o of obstacles){
    const sx = o.worldX - scrollX;
    const obTop = groundY - o.baseH - o.h;
    const ins = HIT_INSET[o.type] || 0;
    const ox = sx + o.w*ins, ow = o.w*(1 - ins*2);
    if(catBox.x < ox+ow && catBox.x+catBox.w > ox &&
       catBox.y < obTop+o.h && catBox.y+catBox.h > obTop){
      gameOver();
      return;
    }
  }

  // 宝石の取得
  for(const g of gems){
    if(g.taken) continue;
    const sx = g.worldX - scrollX;
    if(sx > catBox.x - 10 && sx < catBox.x + catBox.w + 10 &&
       g.y > catBox.y - 10 && g.y < catBox.y + catBox.h + 10){
      g.taken = true;
      bonus += 10;
      pops.push({x: sx, y: g.y, t: 0});
    }
  }

  scoreEl.textContent = 'SCORE: ' + Math.floor(score + bonus);
  dashBtn.disabled = cat.dashCharge > 0;
}

// ---------- 描画：草原 ----------
function drawBackground(){
  if(stageKey === 'cave'){ drawCaveBackground(); return; }
  if(stageKey === 'sky'){ drawSkyBackground(); return; }
  if(stageKey === 'sea'){ drawSeaBackground(); return; }
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for(let i=0;i<3;i++){
    const cx = ((frame*0.4 + i*260) % (W+120)) - 60;
    drawCloud(cx, 40+i*20);
  }
}

function drawCloud(x,y){
  ctx.beginPath();
  ctx.arc(x,y,14,0,Math.PI*2);
  ctx.arc(x+16,y-6,16,0,Math.PI*2);
  ctx.arc(x+32,y,14,0,Math.PI*2);
  ctx.fill();
}

// ---------- 描画：洞窟の背景 ----------
const CAVE_LAYERS = [
  { sp:0.25, spacing:90,  color:'#231a2d', minL:40, maxL:95, w:26, seed:1 },
  { sp:0.5,  spacing:64,  color:'#33273f', minL:25, maxL:70, w:20, seed:7 },
  { sp:0.9,  spacing:110, color:'#150f1c', minL:30, maxL:60, w:22, seed:13 }
];

function drawCaveBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141019');
  g.addColorStop(0.55, '#231a2e');
  g.addColorStop(1, '#2f2238');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  drawBackStalagmites();
  drawStalactites(CAVE_LAYERS[0], false);
  drawStalactites(CAVE_LAYERS[1], true);
  drawStalactites(CAVE_LAYERS[2], false);

  ctx.fillStyle = '#120d18';
  ctx.fillRect(0, 0, W, 12);
}

function drawBackStalagmites(){
  const sp = 0.4, spacing = 130, off = scrollX*sp;
  const first = Math.floor(off/spacing) - 1;
  ctx.fillStyle = '#2a2035';
  for(let i = first; i < first + Math.ceil(W/spacing) + 4; i++){
    const x = i*spacing - off + (hash(i*3+5)-0.5)*50;
    const len = 30 + hash(i*5+2)*55;
    const w = 26 + hash(i*7+9)*14;
    ctx.beginPath();
    ctx.moveTo(x - w, groundY + 30);
    ctx.lineTo(x + w, groundY + 30);
    ctx.lineTo(x, groundY - len);
    ctx.closePath();
    ctx.fill();
  }
}

function drawStalactites(L, withCrystals){
  const off = scrollX * L.sp;
  const first = Math.floor(off/L.spacing) - 1;
  for(let i = first; i < first + Math.ceil(W/L.spacing) + 4; i++){
    const x = i*L.spacing - off + (hash(i*3+L.seed)-0.5)*L.spacing*0.4;
    const len = L.minL + hash(i*5+L.seed+1)*(L.maxL-L.minL);
    const w = L.w*(0.7 + hash(i*7+L.seed+2)*0.6);
    const tipX = x + (hash(i+L.seed)-0.5)*8;
    ctx.fillStyle = L.color;
    ctx.beginPath();
    ctx.moveTo(x - w, 0);
    ctx.lineTo(x + w, 0);
    ctx.lineTo(tipX, len);
    ctx.closePath();
    ctx.fill();

    // つららの先で光る水晶
    if(withCrystals && hash(i*11+L.seed) > 0.62){
      const col = CAVE_CRYSTALS[Math.floor(hash(i*13+L.seed)*CAVE_CRYSTALS.length)];
      const tw = 0.6 + 0.4*Math.sin(frame*0.08 + i);
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.12*tw;
      ctx.beginPath(); ctx.arc(tipX, len+2, 15, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.25*tw;
      ctx.beginPath(); ctx.arc(tipX, len+2, 8, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(tipX, len - 3);
      ctx.lineTo(tipX + 3.5, len + 3);
      ctx.lineTo(tipX, len + 9);
      ctx.lineTo(tipX - 3.5, len + 3);
      ctx.closePath();
      ctx.fill();
    }
  }
}

// ---------- 描画：地面 ----------
function drawGround(){
  if(stageKey === 'sky'){ drawSkyGround(); return; }
  if(stageKey === 'sea'){ drawSeaGround(); return; }
  const cave = stageKey === 'cave';
  let caveGrad = null;
  if(cave){
    caveGrad = ctx.createLinearGradient(0, groundY - maxHill, 0, H);
    caveGrad.addColorStop(0, '#6a5a58');
    caveGrad.addColorStop(1, '#30262c');
  }

  for(const seg of terrainSegments){
    const sx0 = seg.x0 - scrollX, sx1 = seg.x1 - scrollX;
    if(sx1 < 0 || sx0 > W) continue;
    const cx0 = Math.max(sx0, 0), cx1 = Math.min(sx1, W);
    const totalLen = seg.x1 - seg.x0;

    if(seg.gap){
      if(cave){
        // 溶岩
        const grad = ctx.createLinearGradient(0, groundY, 0, H);
        grad.addColorStop(0, '#ffb347');
        grad.addColorStop(0.35, '#ff6a2b');
        grad.addColorStop(1, '#8a1c0c');
        ctx.fillStyle = grad;
        ctx.fillRect(cx0, groundY, cx1-cx0, H-groundY);
        ctx.strokeStyle = 'rgba(255,240,170,0.75)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx0+4, groundY+6);
        for(let wx2=cx0; wx2<cx1; wx2+=14){
          ctx.lineTo(wx2+7, groundY+6+Math.sin((wx2+scrollX+frame*2)*0.15)*2);
        }
        ctx.stroke();
        // ぼこぼこ泡
        ctx.fillStyle = 'rgba(255,225,140,0.85)';
        for(let k=0;k<3;k++){
          const bx = seg.x0 + hash(seg.x0*0.13 + k)*totalLen - scrollX;
          if(bx < 0 || bx > W) continue;
          const by = H - ((frame*0.6 + hash(seg.x0 + k*9)*60) % (H-groundY));
          ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2); ctx.fill();
        }
        // ふちの岩
        ctx.fillStyle = '#3a2f33';
        ctx.fillRect(sx0-3, groundY-6, 5, 12);
        ctx.fillRect(sx1-3, groundY-6, 5, 12);
      } else {
        const grad = ctx.createLinearGradient(0, groundY, 0, H);
        grad.addColorStop(0, '#5fb0d8');
        grad.addColorStop(1, '#2a6f96');
        ctx.fillStyle = grad;
        ctx.fillRect(cx0, groundY, cx1-cx0, H-groundY);
        // 水面のきらめき
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx0+4, groundY+6);
        for(let wx2=cx0; wx2<cx1; wx2+=14){
          ctx.lineTo(wx2+7, groundY+6+Math.sin((wx2+frame*2)*0.15)*2);
        }
        ctx.stroke();
        ctx.fillStyle = '#6bbf5a';
        ctx.fillRect(sx0-3, groundY-6, 5, 12);
        ctx.fillRect(sx1-3, groundY-6, 5, 12);
      }
      continue;
    }

    const yAt = (sx) => {
      const wx = sx + scrollX;
      const t = (wx - seg.x0) / totalLen;
      return groundY - (seg.h0 + (seg.h1 - seg.h0)*t);
    };
    const cy0 = yAt(cx0), cy1 = yAt(cx1);

    ctx.fillStyle = cave ? caveGrad : '#8bd67a';
    ctx.beginPath();
    ctx.moveTo(cx0, cy0);
    ctx.lineTo(cx1, cy1);
    ctx.lineTo(cx1, H);
    ctx.lineTo(cx0, H);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = cave ? '#8f7b76' : '#6bbf5a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx0, cy0);
    ctx.lineTo(cx1, cy1);
    ctx.stroke();
  }

  // 草模様 / 小石模様
  const startOffset = ((scrollX % 40) + 40) % 40;
  for(let sx = -startOffset; sx < W; sx += 40){
    const wx = sx + scrollX;
    if(isGapAt(wx)) continue;
    const h = getHeightAt(wx);
    const y = groundY - h;
    if(cave){
      const idx = Math.round(wx/40);
      ctx.fillStyle = '#3f343a';
      ctx.beginPath();
      ctx.ellipse(sx+9, y+9+hash(idx)*4, 7, 3, 0, 0, Math.PI*2);
      ctx.fill();
      if(hash(idx*3+1) > 0.5){
        ctx.fillStyle = '#7d6a68';
        ctx.fillRect(sx+22, y+7+hash(idx*5)*6, 4, 2);
      }
    } else {
      ctx.fillStyle = '#79cc68';
      ctx.fillRect(sx, y+4, 18, 4);
    }
  }
}

// ---------- 描画：洞窟の入り口 ----------
function drawGate(){
  if(!gate) return;
  const sx = gate.x - scrollX, w = gate.w;
  if(sx < -140 || sx > W+40) return;
  const base = groundY - getHeightAt(gate.x + w/2);
  if(gate.to === 'sky'){ drawPortal(sx, w, base); return; }
  if(gate.to === 'sea'){ drawSeaPortal(sx, w, base); return; }
  const top = base - 150;

  // 岩のかたまり
  ctx.fillStyle = '#8a8378';
  ctx.beginPath();
  ctx.moveTo(sx-26, H);
  ctx.lineTo(sx-26, base-10);
  ctx.quadraticCurveTo(sx-26, top, sx+w/2, top);
  ctx.quadraticCurveTo(sx+w+26, top, sx+w+26, base-10);
  ctx.lineTo(sx+w+26, H);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#6b6459';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#7a7368';
  ctx.beginPath(); ctx.ellipse(sx-8, base-60, 10, 16, 0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sx+w+8, base-80, 9, 18, -0.2, 0, Math.PI*2); ctx.fill();

  // 入り口の暗がり
  const og = ctx.createLinearGradient(0, base-110, 0, base);
  og.addColorStop(0, '#0d0912');
  og.addColorStop(1, '#241a2e');
  ctx.fillStyle = og;
  ctx.beginPath();
  ctx.moveTo(sx+8, base+2);
  ctx.lineTo(sx+8, base-70);
  ctx.arc(sx+w/2, base-70, w/2-8, Math.PI, 0);
  ctx.lineTo(sx+w-8, base+2);
  ctx.closePath();
  ctx.fill();

  // 木の看板
  ctx.fillStyle = '#b8895a';
  roundRect(sx+w/2-25, top+16, 50, 22, 5);
  ctx.fill();
  ctx.strokeStyle = '#7d5a35';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff6e0';
  ctx.font = 'bold 14px "Hiragino Maru Gothic ProN","Comic Sans MS",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('洞窟', sx+w/2, top+27.5);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

// ---------- 描画：空ステージ ----------
function puff(x, y, sc){
  ctx.beginPath();
  const parts = [[0,0,14],[16,-7,17],[34,0,15],[18,5,13]];
  for(const [dx,dy,r] of parts){
    ctx.moveTo(x + dx*sc + r*sc, y + dy*sc);
    ctx.arc(x + dx*sc, y + dy*sc, r*sc, 0, Math.PI*2);
  }
  ctx.fill();
}

function drawCloudLayer(sp, spacing, alpha, baseY, range, scale, seed){
  const off = scrollX * sp;
  const first = Math.floor(off/spacing) - 1;
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  for(let i = first; i < first + Math.ceil(W/spacing) + 4; i++){
    const x = i*spacing - off + (hash(i*3+seed)-0.5)*spacing*0.5;
    const y = baseY + hash(i*5+seed+1)*range;
    const sc = scale*(0.7 + hash(i*7+seed+2)*0.7);
    puff(x, y, sc);
  }
}

function drawSkyBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3d9bff');
  g.addColorStop(0.6, '#8fd0ff');
  g.addColorStop(1, '#d6f0ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 太陽
  const sg = ctx.createRadialGradient(690, 58, 10, 690, 58, 90);
  sg.addColorStop(0, 'rgba(255,248,200,0.9)');
  sg.addColorStop(0.35, 'rgba(255,240,170,0.35)');
  sg.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(690, 58, 90, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff8c8';
  ctx.beginPath(); ctx.arc(690, 58, 26, 0, Math.PI*2); ctx.fill();

  // 遠くの雲（真ん中の層は、雲の切れ目から下に見える）
  drawCloudLayer(0.12, 230, 0.45, 20, 90, 1.3, 3);
  drawCloudLayer(0.22, 200, 0.75, 215, 55, 1.7, 11);
  drawCloudLayer(0.32, 170, 0.8, 30, 80, 0.95, 21);

  // 鳥
  ctx.strokeStyle = '#3b6fa6';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for(let i = 0; i < 3; i++){
    const bx = W + 60 - ((scrollX*0.7 + i*330) % (W + 120));
    const by = 55 + i*38 + Math.sin(frame*0.05 + i*2)*6;
    const flap = Math.sin(frame*0.25 + i)*5;
    ctx.beginPath();
    ctx.moveTo(bx - 9, by - flap*0.5);
    ctx.quadraticCurveTo(bx - 4, by - 4 - flap, bx, by);
    ctx.quadraticCurveTo(bx + 4, by - 4 - flap, bx + 9, by - flap*0.5);
    ctx.stroke();
  }
}

function drawSkyGround(){
  const grad = ctx.createLinearGradient(0, groundY - maxHill, 0, H);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.5, '#e8f4ff');
  grad.addColorStop(1, '#b9dcff');

  for(const seg of terrainSegments){
    const sx0 = seg.x0 - scrollX, sx1 = seg.x1 - scrollX;
    if(sx1 < -20 || sx0 > W+20) continue;

    if(seg.gap){
      // 雲の切れ目：ふちをまるくする
      for(const ex of [sx0, sx1]){
        for(let y = groundY + 4; y < H + 20; y += 20){
          ctx.fillStyle = y < groundY + 30 ? '#ffffff' : '#e3f1ff';
          ctx.beginPath(); ctx.arc(ex, y, 12, 0, Math.PI*2); ctx.fill();
        }
      }
      continue;
    }

    const cx0 = Math.max(sx0, 0), cx1 = Math.min(sx1, W);
    const total = seg.x1 - seg.x0;
    const yAt = (sx) => groundY - (seg.h0 + (seg.h1 - seg.h0)*((sx + scrollX - seg.x0)/total));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx0, yAt(cx0));
    ctx.lineTo(cx1, yAt(cx1));
    ctx.lineTo(cx1, H);
    ctx.lineTo(cx0, H);
    ctx.closePath();
    ctx.fill();
  }

  // 雲のふわふわ（かげ → 白の順に描く）
  const startOffset = ((scrollX % 22) + 22) % 22;
  const puffs = [];
  for(let sx = -startOffset - 22; sx < W + 22; sx += 22){
    const wx = sx + scrollX;
    if(isGapAt(wx)) continue;
    const idx = Math.round(wx/22);
    puffs.push({ sx, y: groundY - getHeightAt(wx) + 9, r: 10 + hash(idx)*5 });
  }
  ctx.fillStyle = '#dbeeff';
  for(const p of puffs){ ctx.beginPath(); ctx.arc(p.sx, p.y + 3, p.r, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#ffffff';
  for(const p of puffs){ ctx.beginPath(); ctx.arc(p.sx, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
}

function drawWindStreaks(){
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for(let i = 0; i < 7; i++){
    const d = scrollX*1.6 + i*173;
    const lap = Math.floor(d/(W + 160));
    const x = W + 80 - (d % (W + 160));
    const y = 30 + hash(i*7 + lap*13)*230;
    const len = 30 + hash(i*3 + lap*5)*40;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y);
    ctx.stroke();
  }
}

function drawStar(cx, cy, r){
  ctx.fillStyle = 'rgba(255,245,170,0.35)';
  ctx.beginPath(); ctx.arc(cx, cy, r*1.9, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  for(let k = 0; k < 10; k++){
    const rad = (k % 2 === 0) ? r*1.15 : r*0.5;
    const ang = -Math.PI/2 + k*Math.PI/5;
    const px = cx + Math.cos(ang)*rad, py = cy + Math.sin(ang)*rad;
    if(k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = '#ffe066';
  ctx.strokeStyle = '#d99a00';
  ctx.lineWidth = 1.3;
  ctx.fill();
  ctx.stroke();
}

function drawStormcloud(sx, top, o){
  const puffsDef = [[0.28,0.62,0.42],[0.52,0.42,0.5],[0.76,0.62,0.38],[0.5,0.78,0.42]];
  ctx.fillStyle = '#5d667c';
  for(const [px, py, pr] of puffsDef){
    ctx.beginPath(); ctx.arc(sx + o.w*px, top + o.h*py, o.h*pr, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#7e889f';
  for(const [px, py, pr] of puffsDef){
    ctx.beginPath(); ctx.arc(sx + o.w*px - 2, top + o.h*py - 3, o.h*pr*0.6, 0, Math.PI*2); ctx.fill();
  }
  // いなずま（ときどきピカッ）
  const flash = (Math.floor(frame/8) + Math.floor(o.worldX)) % 6 === 0;
  ctx.fillStyle = flash ? '#fff35c' : '#e6c93a';
  const cx = sx + o.w*0.5;
  ctx.beginPath();
  ctx.moveTo(cx + 2, top + o.h*0.3);
  ctx.lineTo(cx - 5, top + o.h*0.62);
  ctx.lineTo(cx, top + o.h*0.62);
  ctx.lineTo(cx - 4, top + o.h*0.95);
  ctx.lineTo(cx + 6, top + o.h*0.52);
  ctx.lineTo(cx + 1, top + o.h*0.52);
  ctx.closePath();
  ctx.fill();
}

function drawTornado(sx, top, o){
  const n = 6;
  const by = top + o.h + 4;
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#6f7f9f';
  for(let k = n-1; k >= 0; k--){
    const t = k/(n-1);
    const hw = o.w*(0.12 + 0.38*t);
    const y = by - t*(o.h + 4);
    const cx = sx + o.w/2 + Math.sin(frame*0.2 + k*0.9)*3*(0.3 + t);
    ctx.fillStyle = (k % 2 === 0) ? '#cbd5e8' : '#a3b2cf';
    ctx.beginPath();
    ctx.ellipse(cx, y, hw, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
  }
}

function drawPortal(sx, w, base){
  const cx = sx + w/2, cy = base - 62;
  // まわりの光
  const gl = ctx.createRadialGradient(cx, cy, 10, cx, cy, 95);
  gl.addColorStop(0, 'rgba(255,255,255,0.85)');
  gl.addColorStop(0.4, 'rgba(170,220,255,0.45)');
  gl.addColorStop(1, 'rgba(170,220,255,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(cx, cy, 95, 0, Math.PI*2); ctx.fill();
  // まわる光線
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(frame*0.02);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for(let k = 0; k < 8; k++){
    ctx.rotate(Math.PI/4);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-7, -85);
    ctx.lineTo(7, -85);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  // 輪
  ctx.strokeStyle = '#fff6c2';
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.ellipse(cx, cy, 34, 58, 0, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#ffd84a';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // 中は青空
  const ig = ctx.createLinearGradient(0, cy-58, 0, cy+58);
  ig.addColorStop(0, '#eaf6ff');
  ig.addColorStop(1, '#8fd0ff');
  ctx.fillStyle = ig;
  ctx.beginPath(); ctx.ellipse(cx, cy, 31, 55, 0, 0, Math.PI*2); ctx.fill();
  // 看板
  ctx.fillStyle = '#b8895a';
  roundRect(cx-25, cy-92, 50, 22, 5);
  ctx.fill();
  ctx.strokeStyle = '#7d5a35';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff6e0';
  ctx.font = 'bold 14px "Hiragino Maru Gothic ProN","Comic Sans MS",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('空へ', cx, cy-80.5);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

// ---------- 描画：海底ステージ ----------
function drawSeaBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2aa5e0');
  g.addColorStop(0.5, '#1370b8');
  g.addColorStop(1, '#083a78');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  drawWhale();

  // 水面から差し込む光のカーテン
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  const span = W + 200;
  for(let i = 0; i < 6; i++){
    const raw = i*170 - scrollX*0.06 + Math.sin(frame*0.012 + i)*30;
    const bx = ((raw % span) + span) % span - 100;
    const wTop = 26 + (i % 3)*10;
    ctx.beginPath();
    ctx.moveTo(bx, 0);
    ctx.lineTo(bx + wTop, 0);
    ctx.lineTo(bx + wTop + 120, H);
    ctx.lineTo(bx + 40, H);
    ctx.closePath();
    ctx.fill();
  }

  // 遠くの海底の丘
  drawSeaHills(0.15, 200, 40, '#0e5a9c', 0.011, 1);
  drawSeaHills(0.3, 220, 26, '#0a4682', 0.017, 4);

  drawFishSchools();
  drawKelp();
  drawSeaBubbles(0.5, 9, 0.28, 1, 11, 0.5);
}

// 遠くをゆっくり横切るクジラのシルエット
function drawWhale(){
  const span = W + 700;
  const x = W + 300 - ((scrollX*0.12 + 400) % span);
  const y = 72 + Math.sin(frame*0.02)*6;
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap = 'round';
  // しっぽ（柄 → 尾びれ）
  ctx.strokeStyle = '#1a7ab8';
  ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(-78, -2); ctx.lineTo(-118, -22 + Math.sin(frame*0.05)*3); ctx.stroke();
  ctx.fillStyle = '#1a7ab8';
  ctx.beginPath(); ctx.ellipse(-134, -32, 20, 6, -0.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-116, -42, 20, 6, 0.4, 0, Math.PI*2); ctx.fill();
  // 体
  ctx.beginPath(); ctx.ellipse(0, 0, 95, 34, 0, 0, Math.PI*2); ctx.fill();
  // おなか
  ctx.fillStyle = '#2b90cc';
  ctx.beginPath(); ctx.ellipse(8, 14, 78, 16, 0, 0, Math.PI*2); ctx.fill();
  // 目と胸びれ
  ctx.fillStyle = '#0f5a92';
  ctx.beginPath(); ctx.arc(62, -6, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(22, 22, 18, 6, 0.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSeaHills(sp, baseY, amp, color, freq, seed){
  const off = scrollX*sp;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for(let x = 0; x <= W; x += 16){
    const wx = x + off;
    const y = baseY - amp*(0.5 + 0.5*Math.sin(wx*freq + seed)) - amp*0.4*Math.sin(wx*freq*2.3 + seed*2);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawKelp(){
  const sp = 0.55, spacing = 95, off = scrollX*sp;
  const first = Math.floor(off/spacing) - 1;
  const baseY = groundY + 12;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 6;
  for(let i = first; i < first + Math.ceil(W/spacing) + 3; i++){
    const x = i*spacing - off + (hash(i*3+31)-0.5)*40;
    const len = 60 + hash(i*5+32)*70;
    ctx.strokeStyle = hash(i*7+33) > 0.5 ? '#0f8a86' : '#0c7d92';
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    for(let s = 1; s <= 8; s++){
      const t = s/8;
      ctx.lineTo(x + Math.sin(frame*0.05 + i + t*3)*10*t, baseY - len*t);
    }
    ctx.stroke();
  }
  ctx.lineJoin = 'miter';
}

function drawFish(x, y, s, col, wag){
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(x, y, 8*s, 4.5*s, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 6*s, y);
  ctx.lineTo(x - 13*s, y - 5*s + wag*s);
  ctx.lineTo(x - 13*s, y + 5*s + wag*s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(20,50,90,0.8)';
  ctx.beginPath(); ctx.arc(x + 4*s, y - s, 1.1*s, 0, Math.PI*2); ctx.fill();
}

// 遠景の小魚の群れ（うすい色で、障害物と見まちがえないように）
function drawFishSchools(){
  const cols = ['#7fd0e8', '#f2b6c4', '#e8d28a'];
  const period = W + 260;
  ctx.globalAlpha = 0.6;
  for(let sch = 0; sch < 3; sch++){
    const d = scrollX*0.45 + sch*331 + 60;
    const lap = Math.floor(d/period);
    const x = W + 130 - (d % period);
    const y = 50 + hash(sch*7 + lap*13)*120;
    for(let k = 0; k < 5; k++){
      const fx = x + (k*17 % 50);
      const fy = y + Math.sin(frame*0.06 + k*1.7)*6 + (k % 2)*12;
      drawFish(fx, fy, 0.8, cols[sch], Math.sin(frame*0.3 + k)*1.6);
    }
  }
  ctx.globalAlpha = 1;
}

// ふわふわのぼる泡
function drawSeaBubbles(sp, n, alpha, sizeMul, seed, rise){
  const period = H + 40;
  const span = W + 200;
  ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
  ctx.lineWidth = 1.2;
  for(let i = 0; i < n; i++){
    const d = frame*rise + hash(i*3+seed)*period;
    const lap = Math.floor(d/period);
    const y = H + 20 - (d % period);
    const raw = hash(i*5 + seed + lap*7)*span - scrollX*sp;
    const bx = ((raw % span) + span) % span - 100 + Math.sin(frame*0.04 + i)*4;
    const r = (2 + hash(i*7 + seed + lap)*3.5)*sizeMul;
    ctx.beginPath();
    ctx.arc(bx, y, r, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawSeaGround(){
  const grad = ctx.createLinearGradient(0, groundY - maxHill, 0, H);
  grad.addColorStop(0, '#e6d29b');
  grad.addColorStop(1, '#a88a55');

  for(const seg of terrainSegments){
    const sx0 = seg.x0 - scrollX, sx1 = seg.x1 - scrollX;
    if(sx1 < -20 || sx0 > W+20) continue;
    const cx0 = Math.max(sx0, 0), cx1 = Math.min(sx1, W);
    const totalLen = seg.x1 - seg.x0;

    if(seg.gap){
      // 海溝（まっくらな深み）
      const tg = ctx.createLinearGradient(0, groundY, 0, H);
      tg.addColorStop(0, '#04214a');
      tg.addColorStop(1, '#010a1c');
      ctx.fillStyle = tg;
      ctx.fillRect(cx0, groundY, cx1-cx0, H-groundY);
      // 水のゆらぎ
      ctx.strokeStyle = 'rgba(140,210,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx0+4, groundY+6);
      for(let wx2 = cx0; wx2 < cx1; wx2 += 14){
        ctx.lineTo(wx2+7, groundY+6+Math.sin((wx2+scrollX+frame*2)*0.15)*2);
      }
      ctx.stroke();
      // 深みからのぼる泡
      ctx.strokeStyle = 'rgba(170,225,255,0.6)';
      ctx.lineWidth = 1.2;
      for(let k = 0; k < 3; k++){
        const bx = seg.x0 + hash(seg.x0*0.13 + k)*totalLen - scrollX;
        if(bx < 0 || bx > W) continue;
        const by = H - ((frame*0.6 + hash(seg.x0 + k*9)*60) % (H-groundY));
        ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2); ctx.stroke();
      }
      // ふちの岩
      ctx.fillStyle = '#8f8a86';
      ctx.fillRect(sx0-3, groundY-6, 5, 12);
      ctx.fillRect(sx1-3, groundY-6, 5, 12);
      continue;
    }

    const yAt = (sx) => {
      const wx = sx + scrollX;
      const t = (wx - seg.x0) / totalLen;
      return groundY - (seg.h0 + (seg.h1 - seg.h0)*t);
    };
    const cy0 = yAt(cx0), cy1 = yAt(cx1);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx0, cy0);
    ctx.lineTo(cx1, cy1);
    ctx.lineTo(cx1, H);
    ctx.lineTo(cx0, H);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#f5e4b0';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx0, cy0);
    ctx.lineTo(cx1, cy1);
    ctx.stroke();
  }

  // 砂のもよう（さざなみ・小石・貝がら）
  const startOffset = ((scrollX % 40) + 40) % 40;
  for(let sx = -startOffset; sx < W; sx += 40){
    const wx = sx + scrollX;
    if(isGapAt(wx)) continue;
    const y = groundY - getHeightAt(wx);
    const idx = Math.round(wx/40);
    const r = hash(idx*3 + 2);
    if(r < 0.35){
      ctx.strokeStyle = '#c9ae77';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx+4, y+10);
      ctx.quadraticCurveTo(sx+12, y+5, sx+20, y+10);
      ctx.stroke();
    } else if(r < 0.65){
      ctx.fillStyle = '#b39a68';
      ctx.beginPath();
      ctx.ellipse(sx+10, y+10+hash(idx)*4, 6, 3, 0, 0, Math.PI*2);
      ctx.fill();
    } else if(r < 0.85){
      ctx.fillStyle = '#f7c6d0';
      ctx.beginPath();
      ctx.arc(sx+14, y+13, 6, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#e39aab';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx+14, y+13); ctx.lineTo(sx+14, y+7);
      ctx.moveTo(sx+14, y+13); ctx.lineTo(sx+10, y+8.5);
      ctx.moveTo(sx+14, y+13); ctx.lineTo(sx+18, y+8.5);
      ctx.stroke();
    }
  }
}

// 手前の演出：水の色味・大きな泡・もぐらから出る泡
function drawSeaForeground(){
  ctx.fillStyle = 'rgba(20,110,190,0.08)';
  ctx.fillRect(0, 0, W, H);

  drawSeaBubbles(1.5, 5, 0.4, 1.6, 71, 0.9);

  const hx = cat.x + cat.dashOffset + 44, hy = cat.y - cat.h + 14;
  ctx.lineWidth = 1.3;
  for(let k = 0; k < 4; k++){
    const p = (frame*1.1 + k*15) % 60;
    const life = 1 - p/60;
    const bx = hx - p*0.9 + Math.sin(p*0.25 + k)*2;
    const by = hy - p*0.75;
    ctx.strokeStyle = `rgba(255,255,255,${(0.75*life).toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(bx, by, 1.5 + (k % 3)*0.8*life + 0.8, 0, Math.PI*2);
    ctx.stroke();
  }
}

// 空 → 海底 のゲート（うずまく水の輪）
function drawSeaPortal(sx, w, base){
  const cx = sx + w/2, cy = base - 62;
  // まわりの光
  const gl = ctx.createRadialGradient(cx, cy, 10, cx, cy, 95);
  gl.addColorStop(0, 'rgba(120,235,255,0.75)');
  gl.addColorStop(0.45, 'rgba(60,170,240,0.4)');
  gl.addColorStop(1, 'rgba(60,170,240,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(cx, cy, 95, 0, Math.PI*2); ctx.fill();
  // 輪
  ctx.strokeStyle = '#d9f6ff';
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.ellipse(cx, cy, 34, 58, 0, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#36b6e8';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // 中：うずまく水
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, 31, 55, 0, 0, Math.PI*2); ctx.clip();
  const ig = ctx.createLinearGradient(0, cy-55, 0, cy+55);
  ig.addColorStop(0, '#7fe0ff');
  ig.addColorStop(1, '#0b4f9c');
  ctx.fillStyle = ig;
  ctx.fillRect(cx-32, cy-56, 64, 112);
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for(let a = 0; a < 3; a++){
    ctx.beginPath();
    for(let k = 0; k <= 16; k++){
      const r = k/16;
      const ang = a*Math.PI*2/3 + r*3.2 + frame*0.06;
      const px = cx + Math.cos(ang)*r*32, py = cy + Math.sin(ang)*r*56;
      if(k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
  // 看板
  ctx.fillStyle = '#b8895a';
  roundRect(cx-25, cy-92, 50, 22, 5);
  ctx.fill();
  ctx.strokeStyle = '#7d5a35';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff6e0';
  ctx.font = 'bold 14px "Hiragino Maru Gothic ProN","Comic Sans MS",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('海へ', cx, cy-80.5);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function drawUrchin(sx, top, o){
  const R = Math.min(o.w*0.28, o.h*0.3);
  const cx = sx + o.w/2, cy = top + o.h - R*1.1;
  const n = 14;
  ctx.strokeStyle = '#3d1a5f';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for(let k = 0; k < n; k++){
    const ang = k/n*Math.PI*2 + Math.sin(frame*0.05 + o.worldX)*0.05;
    const len = R*(k % 2 ? 1.75 : 2.0);
    ctx.moveTo(cx + Math.cos(ang)*R*0.8, cy + Math.sin(ang)*R*0.8);
    ctx.lineTo(cx + Math.cos(ang)*len, cy + Math.sin(ang)*len);
  }
  ctx.stroke();
  ctx.fillStyle = '#7a3cae';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(cx - R*0.3, cy - R*0.35, R*0.28, 0, Math.PI*2); ctx.fill();
}

function drawCoral(sx, top, o){
  const col = SEA_CORALS[o.hue || 0];
  const h = o.h, w = o.w;
  const cx = sx + w*0.5;
  const by = top + h + 4;
  const br = [
    [cx, by, cx, top + h*0.42, w*0.26],
    [cx, top + h*0.55, sx + w*0.1, top + h*0.1, w*0.17],
    [cx, top + h*0.45, sx + w*0.9, top + h*0.04, w*0.17],
    [cx, top + h*0.42, cx, top + 2, w*0.17]
  ];
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#4a1f3a';
  for(const [x0, y0, x1, y1, lw] of br){
    ctx.lineWidth = lw + 2.4;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.strokeStyle = col;
  for(const [x0, y0, x1, y1, lw] of br){
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  for(const [, , x1, y1, lw] of br.slice(1)){
    ctx.beginPath(); ctx.arc(x1 - lw*0.15, y1 - lw*0.1, lw*0.22, 0, Math.PI*2); ctx.fill();
  }
}

function drawPearl(cx, cy, s){
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(cx, cy, s*1.8, 0, Math.PI*2); ctx.fill();
  const pg = ctx.createRadialGradient(cx - s*0.3, cy - s*0.35, s*0.1, cx, cy, s*0.95);
  pg.addColorStop(0, '#ffffff');
  pg.addColorStop(0.6, '#ffe9f5');
  pg.addColorStop(1, '#d6b7e6');
  ctx.fillStyle = pg;
  ctx.strokeStyle = '#a98cc0';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, s*0.85, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(cx - s*0.28, cy - s*0.3, s*0.2, 0, Math.PI*2); ctx.fill();
}

// ---------- 描画：障害物・宝石 ----------
function drawObstacles(){
  for(const o of obstacles){
    const sx = o.worldX - scrollX;
    if(sx < -60 || sx > W+60) continue;
    const top = groundY - o.baseH - o.h;
    if(o.type === 'block'){
      ctx.fillStyle = '#5aa04a';
      roundRect(sx, top, o.w, o.h, 6);
      ctx.fill();
      ctx.fillStyle = '#4a8a3c';
      roundRect(sx+4, top+4, o.w-8, o.h-8, 4);
      ctx.fill();
    } else if(o.type === 'rock'){
      // 岩
      ctx.fillStyle = '#9a9a9a';
      ctx.beginPath();
      ctx.ellipse(sx+o.w/2, top+o.h*0.6, o.w/2, o.h*0.55, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(sx+o.w*0.35, top+o.h*0.35, o.w*0.32, o.h*0.32, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#7d7d7d';
      ctx.beginPath();
      ctx.ellipse(sx+o.w*0.6, top+o.h*0.65, o.w*0.18, o.h*0.14, 0.4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#c4c4c4';
      ctx.beginPath();
      ctx.ellipse(sx+o.w*0.32, top+o.h*0.4, o.w*0.1, o.h*0.08, 0, 0, Math.PI*2);
      ctx.fill();
    } else if(o.type === 'stalagmite'){
      drawStalagmite(sx, top, o);
    } else if(o.type === 'crystal'){
      drawCrystal(sx, top, o);
    } else if(o.type === 'stormcloud'){
      drawStormcloud(sx, top, o);
    } else if(o.type === 'tornado'){
      drawTornado(sx, top, o);
    } else if(o.type === 'urchin'){
      drawUrchin(sx, top, o);
    } else if(o.type === 'coral'){
      drawCoral(sx, top, o);
    }
  }
}

function drawStalagmite(sx, top, o){
  const by = top + o.h + 6;
  // 本体
  ctx.fillStyle = '#a89793';
  ctx.beginPath();
  ctx.moveTo(sx, by);
  ctx.lineTo(sx + o.w*0.5, top);
  ctx.lineTo(sx + o.w, by);
  ctx.closePath();
  ctx.fill();
  // 影
  ctx.fillStyle = '#84726f';
  ctx.beginPath();
  ctx.moveTo(sx + o.w*0.5, top);
  ctx.lineTo(sx + o.w, by);
  ctx.lineTo(sx + o.w*0.5, by);
  ctx.closePath();
  ctx.fill();
  // 小さい石筍
  ctx.fillStyle = '#95847f';
  ctx.beginPath();
  ctx.moveTo(sx - o.w*0.18, by);
  ctx.lineTo(sx + o.w*0.12, top + o.h*0.5);
  ctx.lineTo(sx + o.w*0.36, by);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4a3b3f';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(sx, by);
  ctx.lineTo(sx + o.w*0.5, top);
  ctx.lineTo(sx + o.w, by);
  ctx.stroke();
}

function drawCrystal(sx, top, o){
  const col = CAVE_CRYSTALS[o.hue || 0];
  const by = top + o.h + 6;
  const spike = (x0, x1, h, alpha) => {
    ctx.beginPath();
    ctx.moveTo(x0, by);
    ctx.lineTo(x0 + (x1-x0)*0.1, by - h*0.65);
    ctx.lineTo(x0 + (x1-x0)*0.5, by - h);
    ctx.lineTo(x0 + (x1-x0)*0.9, by - h*0.65);
    ctx.lineTo(x1, by);
    ctx.closePath();
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.stroke();
  };
  ctx.strokeStyle = '#3b2a5a';
  ctx.lineWidth = 1.2;
  ctx.fillStyle = col;
  spike(sx + o.w*0.05, sx + o.w*0.42, o.h*0.75, 0.8);
  spike(sx + o.w*0.55, sx + o.w*0.98, o.h*0.6, 0.8);
  spike(sx + o.w*0.25, sx + o.w*0.75, o.h + 6, 1);
  // ハイライト
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.moveTo(sx + o.w*0.38, by - 4);
  ctx.lineTo(sx + o.w*0.36, by - o.h*0.7);
  ctx.lineTo(sx + o.w*0.44, by - o.h*0.85);
  ctx.lineTo(sx + o.w*0.44, by - 4);
  ctx.closePath();
  ctx.fill();
}

function drawGems(){
  for(const g of gems){
    if(g.taken) continue;
    const sx = g.worldX - scrollX;
    if(sx < -20 || sx > W+20) continue;
    const bob = Math.sin((frame + g.phase)*0.1)*3;
    const y = g.y + bob;
    const s = 9 + Math.sin((frame + g.phase)*0.15)*1.2;
    if(stageKey === 'sky'){ drawStar(sx, y, s); continue; }
    if(stageKey === 'sea'){ drawPearl(sx, y, s); continue; }
    ctx.fillStyle = '#ffd84a';
    ctx.strokeStyle = '#b57a00';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx, y - s);
    ctx.lineTo(sx + s*0.75, y);
    ctx.lineTo(sx, y + s);
    ctx.lineTo(sx - s*0.75, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath();
    ctx.moveTo(sx, y - s);
    ctx.lineTo(sx - s*0.75, y);
    ctx.lineTo(sx, y);
    ctx.closePath();
    ctx.fill();
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------- 描画：もぐら ----------
function drawCat(){
  const x = cat.x + cat.dashOffset, y = cat.y - cat.h;
  const bounce = cat.onGround ? Math.abs(Math.sin(cat.legPhase))*3 : 0;

  ctx.save();
  ctx.translate(x, y - bounce);

  const bodyColor = '#8d7466';   // ミズラモグラのビロードのような濃茶〜グレー
  const bodyDark  = '#6f5a4f';
  const shadeColor = '#5f4c43';
  const pawColor = '#e7b9a0';    // 掘るための前足（薄いピンクベージュ）
  const noseColor = '#ff9fb0';
  const outline = '#4a3b34';

  // しっぽ（短くて先が細い）
  const tailWag = cat.onGround ? Math.sin(cat.legPhase*1.4)*5 : -6;
  ctx.strokeStyle = bodyColor;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(6, cat.h*0.6);
  ctx.quadraticCurveTo(-6, cat.h*0.55 + tailWag*0.4, -11, cat.h*0.48 + tailWag);
  ctx.stroke();

  // 後ろ足（開閉2フレーム）
  const isOpenPose = cat.onGround ? (cat.runFrame === 0) : true;
  ctx.fillStyle = shadeColor;
  if(isOpenPose){
    ctx.beginPath();
    ctx.ellipse(12, cat.h-2, 6, 4, -0.3, 0, Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(cat.w*0.3, cat.h-1, 5, 4, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // 体（ずんぐりまんまる）
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(cat.w*0.44, cat.h*0.6, cat.w*0.4, cat.h*0.42, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // お腹（少し明るい毛色）
  ctx.fillStyle = '#a99182';
  ctx.beginPath();
  ctx.ellipse(cat.w*0.4, cat.h*0.72, cat.w*0.22, cat.h*0.22, 0, 0, Math.PI*2);
  ctx.fill();

  // 背中のジェットパック（いつも背負っている）
  const jx = cat.w*0.1, jy = cat.h*0.36;
  const dashT = Math.min(1, cat.dashOffset / DASH_KICK);
  ctx.fillStyle = '#606b78';
  roundRect(jx-7, jy-11, 14, 20, 4);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#3d4650';
  roundRect(jx-7, jy-11, 14, 6, 3);
  ctx.fill();
  ctx.fillStyle = '#ffb347';
  ctx.beginPath(); ctx.arc(jx-3.5, jy-1, 1.6, 0, Math.PI*2); ctx.fill();
  // ノズルの炎（ふだんもゆらゆら燃え、ダッシュ中はさらに勢いよく噴射）
  const idleFlicker = 7 + Math.sin(frame*0.35)*2.5 + Math.sin(frame*0.9)*1.3;
  const flameLen = dashT > 0.02 ? 15 + 23*dashT : idleFlicker;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  [jx-3.5, jx+3.5].forEach((nx, i)=>{
    const wobble = Math.sin(frame*0.5 + i*2)*1.6 + Math.sin(frame*1.3 + i)*0.8;
    const ny = jy + 9;
    const hot = dashT > 0.02;

    // 外側のグロー
    const glowR = flameLen*0.9 + 6;
    const glow = ctx.createRadialGradient(nx, ny+flameLen*0.35, 1, nx, ny+flameLen*0.35, glowR);
    glow.addColorStop(0, hot ? 'rgba(255,200,90,0.6)' : 'rgba(255,190,110,0.4)');
    glow.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(nx, ny+flameLen*0.35, glowR, 0, Math.PI*2); ctx.fill();

    // 外炎（赤オレンジ）
    ctx.fillStyle = hot ? 'rgba(255,90,30,0.9)' : 'rgba(255,140,60,0.65)';
    ctx.beginPath();
    ctx.moveTo(nx-2.8, ny);
    ctx.quadraticCurveTo(nx-4.2+wobble*0.6, ny+flameLen*0.55, nx+wobble, ny+flameLen);
    ctx.quadraticCurveTo(nx+4.2+wobble*0.6, ny+flameLen*0.55, nx+2.8, ny);
    ctx.closePath();
    ctx.fill();

    // 中炎（オレンジ〜黄）
    ctx.fillStyle = hot ? 'rgba(255,170,40,0.95)' : 'rgba(255,190,90,0.8)';
    ctx.beginPath();
    ctx.moveTo(nx-1.7, ny);
    ctx.quadraticCurveTo(nx-2.6+wobble*0.7, ny+flameLen*0.5, nx+wobble*0.8, ny+flameLen*0.72);
    ctx.quadraticCurveTo(nx+2.6+wobble*0.7, ny+flameLen*0.5, nx+1.7, ny);
    ctx.closePath();
    ctx.fill();

    // 内炎（黄〜白）
    ctx.fillStyle = hot ? 'rgba(255,240,190,1)' : 'rgba(255,235,180,0.85)';
    ctx.beginPath();
    ctx.moveTo(nx-0.8, ny);
    ctx.quadraticCurveTo(nx-1+wobble*0.4, ny+flameLen*0.32, nx+wobble*0.3, ny+flameLen*0.46);
    ctx.quadraticCurveTo(nx+1+wobble*0.4, ny+flameLen*0.32, nx+0.8, ny);
    ctx.closePath();
    ctx.fill();

    // 火の粉
    const emberCount = hot ? 4 : 1;
    for(let k=0;k<emberCount;k++){
      const ep = ((frame*3 + k*37 + i*17) % 40) / 40;
      const ex = nx + Math.sin(frame*0.2 + k*2 + i)*5*ep;
      const ey = ny + flameLen*0.6 + ep*22;
      ctx.fillStyle = `rgba(255,${180-Math.floor(ep*100)},${60-Math.floor(ep*40)},${((1-ep)*0.8).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(ex, ey, 1.2*(1-ep*0.6), 0, Math.PI*2); ctx.fill();
    }
  });
  ctx.restore();

  // 前足（腕をつけてから、扇状の爪がある掘る用の手を描く）
  const pawOffset = isOpenPose ? 3 : -1;
  const px = cat.w*0.6 + pawOffset;
  const py = cat.h*0.9;

  // 腕（体とつながって見えるように）
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(px-1, py-9, 5, 8, 0.15, 0, Math.PI*2);
  ctx.fill();

  // 手のひら＋扇状の爪
  ctx.fillStyle = pawColor;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px-6, py-5);
  ctx.quadraticCurveTo(px-9, py, px-7, py+4);
  ctx.lineTo(px-4.5, py+8.5);
  ctx.lineTo(px-2, py+4.5);
  ctx.lineTo(px+0.5, py+9.5);
  ctx.lineTo(px+3, py+4.5);
  ctx.lineTo(px+5.5, py+8.5);
  ctx.lineTo(px+7, py+3.5);
  ctx.quadraticCurveTo(px+9, py, px+6, py-5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 頭（先がとがった鼻先に向かって細くなる）
  const headCx = cat.w*0.68, headCy = cat.h*0.34, headR = cat.h*0.4;
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(headCx, headCy, headR*0.95, headR*0.85, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // 鼻先（ミズラモグラらしい伸びた鼻。ピンクでつやっと）
  ctx.fillStyle = noseColor;
  ctx.beginPath();
  ctx.ellipse(headCx+headR*0.95, headCy+headR*0.12, headR*0.4, headR*0.22, -0.1, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#ff7a94';
  ctx.beginPath();
  ctx.arc(headCx+headR*1.28, headCy+headR*0.1, headR*0.09, 0, Math.PI*2);
  ctx.fill();

  // ひげ（鼻先から数本）
  ctx.strokeStyle = 'rgba(90,70,60,0.6)';
  ctx.lineWidth = 1;
  [-1,0,1].forEach((i)=>{
    ctx.beginPath();
    ctx.moveTo(headCx+headR*1.1, headCy+headR*0.15+i*3);
    ctx.lineTo(headCx+headR*1.7, headCy+headR*0.05+i*6);
    ctx.stroke();
  });

  // ほっぺ（ふんわりピンク）
  ctx.fillStyle = 'rgba(255,160,180,0.35)';
  ctx.beginPath();
  ctx.ellipse(headCx+headR*0.35, headCy+headR*0.32, headR*0.25, headR*0.16, 0, 0, Math.PI*2);
  ctx.fill();

  // 目（モグラらしく小さくてつぶらな一粒）
  ctx.fillStyle = '#2a211d';
  ctx.beginPath();
  ctx.arc(headCx+headR*0.15, headCy-headR*0.15, headR*0.11, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(headCx+headR*0.19, headCy-headR*0.2, headR*0.04, 0, Math.PI*2);
  ctx.fill();

  // 小さい丸耳（毛に半分埋もれている感じ）
  ctx.fillStyle = bodyDark;
  ctx.beginPath();
  ctx.arc(headCx-headR*0.55, headCy-headR*0.4, headR*0.22, 0, Math.PI*2);
  ctx.fill();

  // 洞窟ではライト付きヘルメット
  if(stageKey === 'cave'){
    ctx.fillStyle = '#ffcf3f';
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(headCx, headCy-headR*0.3, headR*0.92, Math.PI*1.02, Math.PI*1.98);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#e0a91a';
    ctx.fillRect(headCx-headR*1.02, headCy-headR*0.35, headR*2.0, 3);
    ctx.fillStyle = '#fffbe0';
    ctx.beginPath();
    ctx.arc(headCx+headR*0.8, headCy-headR*0.55, 2.6, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
  }

  // 空ではプロペラ付きの帽子
  if(stageKey === 'sky'){
    const capY = headCy - headR*0.3;
    ctx.fillStyle = '#ff5d73';
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(headCx, capY, headR*0.92, Math.PI*1.02, Math.PI*1.98);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(headCx - headR*0.16, headCy - headR*1.12, headR*0.32, headR*0.76);
    ctx.fillStyle = '#c93a52';
    ctx.fillRect(headCx - headR*1.02, headCy - headR*0.35, headR*2.0, 3);
    // プロペラ（くるくる回る）
    const topY = capY - headR*0.92;
    ctx.strokeStyle = '#6b6b6b';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(headCx, topY + 1); ctx.lineTo(headCx, topY - 4); ctx.stroke();
    const bl = headR*1.15*Math.cos(frame*0.7);
    ctx.strokeStyle = '#ffd84a';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(headCx - bl, topY - 4); ctx.lineTo(headCx + bl, topY - 4); ctx.stroke();
  }

  // 海底ではシュノーケルとゴーグル
  if(stageKey === 'sea'){
    const ex = headCx + headR*0.15, ey = headCy - headR*0.15;
    ctx.lineCap = 'round';
    // シュノーケル（ゴーグルのバンドから上へのびる）
    ctx.strokeStyle = '#ff9f1c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(headCx - headR*0.55, headCy - headR*0.1);
    ctx.quadraticCurveTo(headCx - headR*1.15, headCy - headR*0.5, headCx - headR*0.85, headCy - headR*1.6);
    ctx.stroke();
    ctx.fillStyle = '#ff5d73';
    ctx.beginPath(); ctx.arc(headCx - headR*0.85, headCy - headR*1.6, 2.4, 0, Math.PI*2); ctx.fill();
    // バンド
    ctx.strokeStyle = '#1f4f8a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(ex - headR*0.45, ey);
    ctx.lineTo(headCx - headR*0.95, headCy - headR*0.1);
    ctx.stroke();
    // ガラス
    ctx.fillStyle = 'rgba(170,230,255,0.55)';
    ctx.strokeStyle = '#2b6fb8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(ex, ey, headR*0.5, headR*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.ellipse(ex - headR*0.15, ey - headR*0.14, headR*0.14, headR*0.07, -0.5, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  lamp.x = x + headCx + headR*0.8;
  lamp.y = y - bounce + headCy - headR*0.55;
}

// ---------- 描画：洞窟のライティング ----------
function drawCaveLighting(){
  // まわりを暗く（もぐらのライトの周りだけ明るい）
  const dk = LEVELS[levelKey].dark;
  const vg = ctx.createRadialGradient(lamp.x, lamp.y, dk.inner, lamp.x, lamp.y, 460);
  vg.addColorStop(0, 'rgba(6,3,14,0)');
  vg.addColorStop(0.45, `rgba(6,3,14,${(dk.alpha*0.37).toFixed(3)})`);
  vg.addColorStop(1, `rgba(6,3,14,${dk.alpha})`);
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // 光るものは暗がりの上から足す
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // ライトの光線
  const cone = ctx.createLinearGradient(lamp.x, lamp.y, lamp.x+300, lamp.y);
  cone.addColorStop(0, 'rgba(255,240,180,0.30)');
  cone.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = cone;
  ctx.beginPath();
  ctx.moveTo(lamp.x, lamp.y);
  ctx.lineTo(lamp.x+300, lamp.y-70);
  ctx.lineTo(lamp.x+300, lamp.y+120);
  ctx.closePath();
  ctx.fill();

  // 溶岩の照り返し
  for(const seg of terrainSegments){
    if(!seg.gap) continue;
    const sx0 = seg.x0 - scrollX, sx1 = seg.x1 - scrollX;
    if(sx1 < 0 || sx0 > W) continue;
    const x0 = Math.max(sx0-20, 0), x1 = Math.min(sx1+20, W);
    const lg = ctx.createLinearGradient(0, groundY-70, 0, groundY+10);
    lg.addColorStop(0, 'rgba(255,120,40,0)');
    lg.addColorStop(1, 'rgba(255,120,40,0.35)');
    ctx.fillStyle = lg;
    ctx.fillRect(x0, groundY-70, x1-x0, 80);
  }

  // 空へのゲートの光（暗闇の中でも目立つように）
  if(gate && gate.to === 'sky'){
    const gx = gate.x - scrollX + gate.w/2;
    const gy = groundY - getHeightAt(gate.x + gate.w/2) - 62;
    if(gx > -120 && gx < W + 120){
      const pg = ctx.createRadialGradient(gx, gy, 10, gx, gy, 120);
      pg.addColorStop(0, 'rgba(210,235,255,0.55)');
      pg.addColorStop(1, 'rgba(210,235,255,0)');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(gx, gy, 120, 0, Math.PI*2); ctx.fill();
    }
  }

  // 水晶の光
  for(const o of obstacles){
    if(o.type !== 'crystal') continue;
    const sx = o.worldX - scrollX;
    if(sx < -60 || sx > W+60) continue;
    const cx = sx + o.w/2, cy = groundY - o.baseH - o.h*0.5;
    const tw = 0.75 + 0.25*Math.sin(frame*0.1 + o.worldX);
    ctx.fillStyle = CAVE_CRYSTALS[o.hue || 0];
    ctx.globalAlpha = 0.14*tw;
    ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.22*tw;
    ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 宝石の光
  ctx.fillStyle = '#ffd84a';
  for(const g of gems){
    if(g.taken) continue;
    const sx = g.worldX - scrollX;
    if(sx < -30 || sx > W+30) continue;
    const y = g.y + Math.sin((frame + g.phase)*0.1)*3;
    ctx.globalAlpha = 0.16;
    ctx.beginPath(); ctx.arc(sx, y, 22, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(sx, y, 12, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ---------- 描画：演出（+10 / フェード / ステージ名） ----------
function drawEffects(){
  for(const p of pops){
    ctx.globalAlpha = 1 - p.t/40;
    ctx.fillStyle = '#ffe680';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.font = 'bold 16px "Hiragino Maru Gothic ProN","Comic Sans MS",sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('+10', p.x, p.y - p.t);
    ctx.fillText('+10', p.x, p.y - p.t);
  }
  ctx.globalAlpha = 1;

  if(fade > 0){
    ctx.fillStyle = `rgba(${fadeColor},${fade})`;
    ctx.fillRect(0, 0, W, H);
  }

  if(banner.t > 0){
    const a = Math.min(1, banner.t/25, (BANNER_FRAMES - banner.t)/15);
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = 'bold 30px "Hiragino Maru Gothic ProN","Comic Sans MS",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.strokeText(banner.text, W/2, 100);
    ctx.fillStyle = '#fff';
    ctx.fillText(banner.text, W/2, 100);
    if(banner.sub){
      ctx.font = 'bold 20px "Hiragino Maru Gothic ProN","Comic Sans MS",sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeText(banner.sub, W/2, 134);
      ctx.fillText(banner.sub, W/2, 134);
    }
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
  }
  ctx.textAlign = 'start';
}

function draw(){
  drawBackground();
  drawGround();
  drawGate();
  drawObstacles();
  drawGems();
  drawCat();
  if(stageKey === 'sky') drawWindStreaks();
  if(stageKey === 'sea') drawSeaForeground();
  if(stageKey === 'cave') drawCaveLighting();
  drawEffects();
}

// 固定タイムステップ：60Hz相当でupdateを回し、描画は画面のリフレッシュに合わせる
function loop(ts){
  if(state !== 'playing') return;
  if(!last) last = ts;
  acc += Math.min(ts - last, 100); // タブ復帰時などの急な進みを抑える
  last = ts;
  while(acc >= STEP){
    update();
    acc -= STEP;
    if(state !== 'playing') return;
  }
  draw();
  requestAnimationFrame(loop);
}

// 初期表示
overlay.innerHTML = MENU_HTML;
initTerrain();
applyStageUI();
drawBackground();
drawGround();
drawCat();

// 入力
window.addEventListener('keydown', (e)=>{
  if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat) jump(); }
  if(e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX'){
    e.preventDefault();
    if(!e.repeat) tryDash();
  }
});
// マウス・タッチ・ペンを pointerdown で一本化（ゲーム領域のどこでもジャンプ）
wrap.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('button')) return; // ボタンのclickを潰さない
  e.preventDefault();
  jump();
});
// スマホ用ジェットダッシュボタン
const dashBtn = document.getElementById('dashBtn');
dashBtn.addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  e.stopPropagation();
  tryDash();
});
// ステージ選択・リトライ・メニューのボタン
overlay.addEventListener('click', (e)=>{
  const b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.stage) showLevelMenu(b.dataset.stage);
  else if(b.dataset.level) startGame(pendingStage, b.dataset.level);
  else if(b.id === 'backBtn') showMenu();
  else if(b.id === 'retryBtn') startGame();
  else if(b.id === 'menuBtn') showMenu();
});
</script>
